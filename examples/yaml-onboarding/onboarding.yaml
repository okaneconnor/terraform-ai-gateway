# This file lives in YOUR repository, not in the module. Application teams add
# themselves here by raising a pull request against you, and you review and merge it.
# One subscription is created per service.
#
# A team's workload identity also needs your gateway's app role granted to it. That
# happens in your directory rather than in this file, because assigning app roles
# needs directory permission. Without it a call is refused with missing_role,
# whatever this file says.
version: v1

applications:
  - application: orders
    owner: payments-team

    # Identities allowed to use this application. service-principal ids are bound
    # into the product policy, so a token from anything else is refused even with a
    # valid key.
    accessType:
      service-principal:
        ids:
          - REPLACE_WITH_CLIENT_SP_OBJECT_ID

    # Applies across all of this application's services combined.
    limits:
      requestsPerMinute: 60
      dailyTokenQuota: 50000

    services:
      - service: chat
        capability:
          api: chat-completions-v1
          allowedModels:
            - gpt-4o

      - service: summariser
        capability:
          api: chat-completions-v1
          allowedModels:
            - gpt-4o
        # Tighter than the application's shared pool.
        limits:
          requestsPerMinute: 10
        # Everything else inherits; only Violence is loosened.
        contentSafety:
          categories:
            violence:
              threshold: 6

openapi: "3.1.0"

info:
  title: Document Intelligence
  version: "1.0.0"
  description: >
    Document analysis (OCR, layout and prebuilt models) through the AI Gateway.
    Analysis is asynchronous: POST a document to start an operation, then poll the
    URL returned in the Operation-Location header until status is succeeded.
    Both calls go through the gateway; Operation-Location points at the gateway,
    never at the backend AI resource. Every request must carry a valid Entra token
    holding one of the gateway's required app roles, and the subscription key issued
    to the calling service.

security:
  - EntraBearer: []
    ApimSubscriptionKey: []

components:
  securitySchemes:
    EntraBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Entra v2.0 JWT. Callers request a token for api://<client-id>/.default using
        client credentials. Must carry the gateway's required app role. Callers must be
        managed identities or service principals; no interactive flow is supported.
    ApimSubscriptionKey:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
      description: APIM subscription key for the calling service.

  parameters:
    ModelId:
      name: modelId
      in: path
      required: true
      description: >
        Document Intelligence model to analyse with, for example prebuilt-read or
        prebuilt-layout. It must be on the service's allowed list; any other model is
        refused with 403 model_not_permitted.
      schema:
        type: string

  schemas:
    AnalyzeRequest:
      type: object
      description: Exactly one of urlSource or base64Source.
      properties:
        urlSource:
          type: string
          format: uri
          description: Address of the document. The backend must be able to fetch it.
        base64Source:
          type: string
          format: byte
          description: The document, base64 encoded.
    AnalyzeOperation:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [notStarted, running, failed, succeeded]
        createdDateTime:
          type: string
          format: date-time
        lastUpdatedDateTime:
          type: string
          format: date-time
        analyzeResult:
          type: object
          description: Present once status is succeeded. Shape is defined by the backend model.
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string

paths:
  /documentModels/{modelId}:analyze:
    post:
      operationId: analyzeDocument
      summary: Start a document analysis
      description: >
        Starts an asynchronous analysis and returns 202 with an Operation-Location
        header. That header points at this gateway: poll it with getAnalyzeResult. The
        gateway sets the backend api-version itself and discards any sent by the caller.
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - name: pages
          in: query
          required: false
          description: Page range to analyse, for example 1-3.
          schema:
            type: string
        - name: locale
          in: query
          required: false
          schema:
            type: string
        - name: stringIndexType
          in: query
          required: false
          schema:
            type: string
            enum: [textElements, unicodeCodePoint, utf16CodeUnit]
        - name: outputContentFormat
          in: query
          required: false
          schema:
            type: string
            enum: [text, markdown]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/tiff:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Analysis started.
          headers:
            Operation-Location:
              description: Gateway URL to poll for the result.
              schema:
                type: string
                format: uri
        "400":
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token or subscription key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Role missing, identity not permitted, model not permitted, or capability not granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Request rate or quota exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /documentModels/{modelId}/analyzeResults/{resultId}:
    get:
      operationId: getAnalyzeResult
      summary: Get the result of a document analysis
      description: >
        Returns the status of an analysis started by analyzeDocument, and the extracted
        result once status is succeeded. Poll at your own interval; a second or more
        between calls is sensible.
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - name: resultId
          in: path
          required: true
          description: Result identifier taken from the Operation-Location header.
          schema:
            type: string
      responses:
        "200":
          description: Current status, with the result once succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeOperation"
        "401":
          description: Missing or invalid token or subscription key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Role missing, identity not permitted, model not permitted, or capability not granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such analysis.
        "429":
          description: Request rate or quota exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
